  <script>

    // Tiempos según la voz (la frase empieza a los 0.2 s de la escena)

    tl.fromTo("#repasos-eje", { opacity: 0, x: -20 }, { opacity: 1, x: 0, duration: 0.4 }, T(2.6));
    // La mascota recorre la memoria: cada repaso la sube otra vez

    tl.fromTo("#repasos-curva", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: DURA / 1.1, ease: "none" }, T(INICIO));

    tl.fromTo(jinete, { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(3)" }, T(INICIO));
    // Cada marca aparece justo cuando la mascota llega
    const cuando = (mx, my) => { for (let l = 0; l <= largo; l += 2) { const pt = camino.getPointAtLength(l); if (Math.abs(pt.x - mx) < 4 && Math.abs(pt.y - my) < 6) return INICIO + (l / largo) * DURA; } return INICIO + DURA; };
    [["#repasos-m1", "#repasos-o1", 380, 330], ["#repasos-m2", "#repasos-o2", 760, 330], ["#repasos-m3", "#repasos-o3", 1240, 330], ["#repasos-m4", "#repasos-o4", 1700, 440]].forEach(([m, o, x, y]) => {
